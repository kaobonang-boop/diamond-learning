    <form id="signup-form" onsubmit="return submitAuthForm(event, 'signup')" style="display:none;">
      <label class="field-label">First name</label>
      <input class="field-input" name="first_name" type="text" required>
      <label class="field-label">Last name</label>
      <input class="field-input" name="last_name" type="text" required>
      <label class="field-label">Your level</label>
      <div class="radio-row">
        <div>
          {% for level in AUTH_MODAL_LEVELS %}
          <label><input type="radio" name="education_level" value="{{ level.id }}" required> {{ level.code }}</label>
          {% endfor %}
        </div>
      </div>
      <label class="field-label">Username</label>
      <input class="field-input" name="username" type="text" required>
      <label class="field-label">Email</label>
      <input class="field-input" name="email" type="email" required>
      <label class="field-label">Password</label>
      <input class="field-input" name="password1" type="password" required>
      <label class="field-label">Confirm password</label>
      <input class="field-input" name="password2" type="password" required>
      <button class="auth-submit" type="submit">Create Account</button>
    </form>
