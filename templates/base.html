{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Diamond Learning{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
{% block extra_head %}{% endblock %}
</head>
<body>
{% csrf_token %}
<div class="shell">

  <div class="topbar">
    <a class="brand" href="{% url 'core:home' %}">
      <span class="brand-mark"><svg class="grad-cap" viewBox="0 0 40 32"><polygon points="20,3 38,11 20,19 2,11" fill="#1F2937"/><path d="M10 13 v6 a10 5 0 0 0 20 0 v-6" fill="none" stroke="#1F2937" stroke-width="2"/><circle cx="20" cy="11" r="1.6" fill="#DC2626"/><path d="M20 11 L28 15 L28 25" stroke="#DC2626" stroke-width="1.6" fill="none"/><circle cx="28" cy="27" r="2.3" fill="#DC2626"/></svg><span class="d">Diamond</span></span> Learning
    </a>

    <form class="searchbar-wrap" action="{% url 'core:search' %}" method="get">
      <div class="searchbar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" name="q" placeholder="Diamond Search subjects, papers, pages…" value="{{ request.GET.q }}">
      </div>
    </form>

    <div class="top-actions">
      {% if user.is_authenticated %}
        <div class="account-menu" tabindex="0">
          <button class="avatar" type="button">{{ user.first_name|default:user.username|slice:":1"|upper }}{{ user.last_name|slice:":1"|upper }}</button>
          <div class="account-dropdown">
            <a href="{% url 'core:dashboard' %}">Dashboard</a>
            <a href="{% url 'accounts:edit_profile' %}">Account settings</a>
            <a href="{% url 'accounts:password_change' %}">Change password</a>
            <form action="{% url 'accounts:logout' %}" method="post">
              {% csrf_token %}
              <button class="danger" type="submit">Log out</button>
            </form>
          </div>
        </div>
      {% else %}
        <button class="signin-btn" type="button" onclick="openAuthModal('signin')">Sign In</button>
      {% endif %}
    </div>
  </div>

  <div class="mainnav">
    <a class="nav-item {% if request.resolver_match.app_name == 'core' and request.path == '/' %}active{% endif %}" href="{% url 'core:home' %}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
      HOME
    </a>
    <a class="nav-item {% if request.resolver_match.app_name == 'syllabus' %}active{% endif %}" href="{% url 'syllabus:level_list' %}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path
