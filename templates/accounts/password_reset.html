{% extends "base.html" %}
{% block title %}Reset password — Diamond Learning{% endblock %}
{% block content %}
<div class="form-card">
  <h2 style="margin-bottom:20px;">Reset your password</h2>
  <p class="desc" style="margin-bottom:16px;">Enter your email and we'll send you a link to reset your password.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.email }}
    <button class="auth-submit" type="submit">Send reset link</button>
  </form>
</div>
{% endblock %}
