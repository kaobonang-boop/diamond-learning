{% extends "base.html" %}
{% block content %}
<div class="form-card">
  <h2 style="margin-bottom:20px;">Set a new password</h2>
  {% if validlink %}
  <form method="post">
    {% csrf_token %}
    <label class="field-label">New password</label>
    {{ form.new_password1 }}
    <label class="field-label">Confirm new password</label>
    {{ form.new_password2 }}
    <button class="auth-submit" type="submit">Reset password</button>
  </form>
  {% else %}
  <p class="desc">This reset link is invalid or has expired.</p>
  {% endif %}
</div>
{% endblock %}
